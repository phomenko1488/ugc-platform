spring.application.name=ugc
server.port=80

# --- MySQL Database Configuration ---
spring.datasource.url=jdbc:mysql://localhost:3306/ugc_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=DyNaMo12
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- YouTube & External API Keys ---
app.youtube.api-key=YOUR_YOUTUBE_API_KEY

# --- Auth: JWT (Module 1) ---
# Dev-only default secret (Base64, HS256, >=256 bit). ROTATE before production and move to an env var / secret manager.
app.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktdWdjLWZsb3ctand0LXNlY3JldC1kby1ub3QtdXNlLWluLXByb2QtcGxlYXNlLXJvdGF0ZS1tZQ==}
app.jwt.access-token-ttl-minutes=1440
app.jwt.refresh-token-ttl-days=30
app.jwt.issuer=ugc-flow

# --- Auth: Telegram WebApp (Module 1) ---
app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:8355986471:AAFxjAj84nt-p03FY2JmGLNVtQnEfnFrNXw}
app.telegram.init-data-max-age-seconds=86400

# --- Telegram Bot Engine & Notifications (Module 6) ---
app.telegram.api-base=https://api.telegram.org
app.telegram.bot-username=${TELEGRAM_BOT_USERNAME:ugc_flow_bot}
# Master switch for actually calling the Telegram Bot API (sendMessage / getUpdates). Off by
# default: in dev/CI this logs every outbound message to the console instead of making a real
# HTTP call — flip on (and provide a real app.telegram.bot-token above) once deployed.
platform.telegram.enabled=${TELEGRAM_ENABLED:false}
app.telegram.update-poll-delay-ms=3000
# TTL for a POST /api/v1/users/{userId}/tg-bind-token one-time token.
app.telegram.tg-bind-ttl-minutes=15
# TTL for a POST /api/v1/auth/forgot-password one-time reset token.
app.auth.password-reset-ttl-minutes=60

# --- Email Service (Module 7) ---
# Master switch for actually sending mail via JavaMailSender. Off by default: in dev/CI every
# email is logged to the console instead of being sent — flip on (and fill in spring.mail.* below)
# once deployed with a real SMTP relay.
platform.mail.enabled=${MAIL_ENABLED:false}
platform.mail.from=${MAIL_FROM:no-reply@ugcflow.local}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Frontend base URL (used to build links embedded in emails/Telegram messages, e.g. the
# password-reset link) ---
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# --- Media upload (Module 4) ---
app.media.upload-dir=uploads
app.media.base-url=http://localhost:80
app.media.max-file-size-bytes=10485760

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB